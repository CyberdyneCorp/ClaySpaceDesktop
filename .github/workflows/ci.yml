# The gate. Everything that has to hold before a change lands.
#
# Two C++ engines are vendored as submodules and built from source with CMake —
# ClayCore, and CyberRemesherAndUV since #94 — so every job compiles C++20
# before it compiles a line of Rust. That is what the ccache step below is for.
#
# The two engines are about 300 translation units — ccache counted 300
# cacheable calls until #126 moved the ClayCore pin and 303 after — and
# compiling all of them costs `macOS, Metal (release)` a median 4.7 min against
# 0.3 with a warm ccache. Worth caching, and still not what dominates the
# matrix: 4.7 min is a twelfth of a job that has run 43 to 70.
#
# Both of those figures are read inside a single Build step, from cargo's own
# `Compiling <crate>` timestamps, rather than by pairing one run's Build total
# against another's — the budget note on `test` below explains why that
# distinction is the whole of #83. `tools/ci_budget.json` is the Actions-API
# pull behind every number in it, and `tools/check_ci_budget.py` holds the note
# to the table so the two cannot drift apart again.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `record-baseline` is run by hand, so the workflow has to be dispatchable.
  workflow_dispatch:
    inputs:
      record_baseline:
        description: Record benchmark baselines and upload them as artifacts
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a CI failure costs nothing and saves a round trip.
  RUST_BACKTRACE: 1

# Six macOS jobs go out per push — four `test` rows plus the benchmark and the
# document-bytes check — against a hosted concurrency cap of five. A superseded
# push therefore keeps holding slots that the push replacing it is queuing for,
# which is felt as CI being slow when it is really CI being full.
#
# Per ref rather than per workflow: two branches must still run at once, and
# only the older run of the SAME ref is redundant. `main` is excluded, because
# a cancelled push to main leaves no record that the merge was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The four configurations the specification names. CPU is always compiled
  # into the engine, so the CPU-only rows are the ones that must pass
  # everywhere; the accelerated rows are what the acceleration policy is for.
  test:
    name: ${{ matrix.name }} (${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    # Seventy-five, and each job now runs *one* profile rather than both.
    #
    # The budget was sixty, then ninety, and the ninety was reached: the Metal
    # job was cancelled at 90:13 with two tests of the release suite left to
    # run. Its own note said what to do about that — "if it approaches ninety,
    # the answer is to make it faster, not to raise this again" — and the split
    # below is that answer, taken without deleting a test or weakening an
    # assertion.
    #
    # Measured on the run that was cancelled: 3 min to build, **37 min** for
    # the debug suite, **49 min** for the release step, of which only 24 were
    # tests and 25 were the release compile the debug step had not done. Two
    # profiles in one job is two builds and two suites in series, and the
    # slower one had been carrying the faster one over the line.
    #
    # Split on every row and not only on Metal. Linux and macOS CPU-only are
    # not near the wall today, and a matrix whose rows are shaped differently
    # is one where the row that matters is the one nobody has looked at.
    #
    # Seventy-five rather than sixty: sixty was tried first and cancelled
    # `macOS, Metal (release)` at 60:50. The reasoning recorded here for the
    # seventy-five — that the slowest job was "build 20 min, the C++ engine,
    # and a restored cache does not spare most of it", so ~58 min cold — does
    # not survive step-level timings. Most of that twenty minutes is cargo's
    # optimised codegen. But the engine is not nothing either, and the place to
    # separate them is *inside* one Build step, where no choice of runs can
    # steer the answer: cargo prints `Compiling <crate>` when it starts one, and
    # `claycore` cannot start until `claycore-sys` — whose build.rs is what runs
    # CMake over the vendored C++ — has finished. The later of that gap and
    # cyberremesh's bounds the window both engines were compiled in. Across the
    # twenty-two `macOS, Metal (release)` jobs sampled below:
    #
    #     ccache              engine window            Build
    #     no step (18 jobs)   3.3 - 6.0, median 4.7    20.3 - 35.0
    #       0 / 300 hits      4.6                      25.2
    #     300 / 300 hits      0.33, 0.36               23.3, 20.3
    #     208 / 303 hits      1.7                      23.9
    #
    # So ccache takes the engines from a median 4.7 min to 0.3 on this row —
    # about four and a quarter minutes off a job that has run 43 to 70. Not
    # invisible. What it is not is *separable from a Build total*: the two fully
    # warm Builds are 23.3 and 20.3, three minutes apart with the same twenty-
    # second window, and the eighteen with no ccache at all spread fifteen
    # minutes. One commit's Build set against another's says whatever the pair
    # was chosen to say — which is how two drafts of this note arrived at "the
    # engine is invisible in that step" while the row's own cold/warm control
    # said 25.2 against 20.3.
    #
    # The debug row, whose Rust compile is small, agrees from the other side.
    # Its Build was 3.5 - 5.9 min (median 4.7) over the eighteen runs with no
    # ccache step and is 1.2 - 1.8 with one warm:
    #
    #     run           ccache hits   build
    #     34669732006     300 / 300     1.2
    #     34668263566     275 / 300     1.8
    #     34783040917     208 / 303     2.7   ClayCore pin moved
    #     34661097385       0 / 300     3.8   the ccache step's own first run
    #
    # Monotone — but the bottom row is a floor on the cold case rather than a
    # measure of it. 3.8 is faster than fifteen of the eighteen Builds that had
    # no ccache at all, so 3.8 − 1.2 = 2.6 understates what ccache buys here;
    # the 3.5 - 5.9 range against 1.2 - 1.8 is the figure, and it is the same
    # three-to-four minutes the release row's window shows.
    #
    # Those four ccache-era runs are the right sample for the engine and the
    # WRONG one for this budget: filtering on "has a ccache step" keeps four
    # runs from two days, and by job time they rank 1, 2, 8 and 9 of the
    # twenty-two — mean 48.0 against the row's 53.8. The budget gates the
    # release row, so the sample is every `macOS, Metal (release)` job on `main`
    # since both engines landed — runs 34339376851 (#94) through 34783040917
    # (#126), the same eight-row matrix throughout, twenty-two of which reached
    # the test step:
    #
    #     min 43.2    mean 53.8    sd 6.2    max 70.1
    #
    # Three of the twenty-two ran past sixty — that is the shape sixty was
    # cancelling. The worst, run 34592697101 at 70.1 min, leaves 4.9 min under
    # this budget. Seventy-five is not headroom; it is one slow runner from a
    # cancel.
    #
    # One of the twenty-two went red: run 34623657105 failed a single assertion
    # out of 2363. It is counted anyway, because `--no-fail-fast` below meant it
    # still ran all 196 suites and paid for them — 52.3 min, against a median of
    # 53.7; dropping it gives mean 53.9, sd 6.4. Named rather than quietly
    # folded in, because a distribution offered as an operating envelope should
    # say which of its jobs did not pass.
    #
    # That worst run was not a cold one. Its cargo cache logged `full match:
    # true` and it ran 2353 passing tests, twenty-six fewer than the 43.2-min
    # run; Build was 35.0 and Test 34.3, both simply slow. Over the twenty-two,
    # Build is 41-54% of the job (mean 48%: 25.9 min against 27.2 for Test) and
    # the two track the job time equally, r = 0.84 and 0.87. Runs 34661093529
    # (#114) and 34661097385 (#115) show why: pushed four seconds apart, the
    # same 2374 passing tests, Test 31.9 min against 20.5. Eleven minutes on
    # identical work, from the runner and nothing else.
    #
    # Cache state belongs in this reasoning, and both caches are in it, for
    # different reasons.
    #
    # ccache is keyed on `matrix.slug` alone, so a lockfile bump or a toolchain
    # update leaves it whole. What can still cold it is eviction:
    # `hendrikmuhs/ccache-action` writes a fresh timestamped entry every run and
    # restores by prefix — `ccache-macos-metal-2026-09-12T05:38:07.246Z` and its
    # neighbours — so GitHub's seven-day idle expiry and 10 GB repository
    # ceiling are exactly the events that can take it away, and nothing in the
    # source is. The one cold run on record is 34661097385, and only because the
    # step was new there: `No cache found`, 0 / 300 hits, Build 25.2. Run
    # 34783040917 is not a second one — 95 of its 303 calls missed, but its
    # cyberremesh window stayed at 17 s while claycore's went to 105 s, so only
    # ClayCore's objects missed. That is the #126 pin move, which is a source
    # change and precisely what keying on the row is meant to absorb.
    #
    # The cargo cache is the one a source change does move: the Swatinem key
    # below ends in a hash of the dependency graph — `…-083c28b9` on run
    # 34339376851, and `…-c4775e20` on every run since — and that first run is
    # the only one on `main` to log `full match: false`. It still restored
    # 247 MB under a restore-key and finished in 54.8 min, a minute above the
    # median, so a partial miss costs this row nothing worth measuring. What a
    # *total* miss costs is unknown: no run on record has had one.
    #
    # Left at seventy-five for that combination — a six-minute run-to-run sd, a
    # worst case within five minutes of the wall, and a cold-cargo case nobody
    # has sampled. Tightening it means moving the distribution, not lowering
    # the number, and there is no single step to send someone at: the two
    # halves cost the same and rise together. The move that touches both is
    # sharding this row, as ClayCore sharded its own suite for v0.78.0.
    timeout-minutes: 75
    strategy:
      # One row failing should not hide the others: a Metal-only regression is
      # worth seeing next to a green CPU run — and now a release-only one is
      # worth seeing next to a green debug run.
      fail-fast: false
      matrix:
        # Each configuration is tested twice: once in the profile a
        # `debug_assertions` check runs in, once in the profile a timing budget
        # means anything in. They were always both run; they are no longer run
        # one after the other.
        profile: [debug, release]
        target: [macos-cpu, macos-metal, linux-cpu, linux-vulkan]
        include:
          # What each profile costs cargo on the command line, carried here
          # rather than spelled as a conditional at both call sites: an
          # expression that renders to nothing leaves a dangling line
          # continuation behind it, and a build step whose shell is only
          # accidentally valid is one nobody will want to edit.
          - profile: debug
            flag: ""
          - profile: release
            flag: "--release"
          - target: macos-cpu
            name: macOS, CPU only
            slug: macos-cpu
            os: macos-14
            features: ""
            cpu_only: true
          - target: macos-metal
            name: macOS, Metal
            slug: macos-metal
            os: macos-14
            features: "--features clayspace-engine/metal"
          - target: linux-cpu
            name: Linux, CPU only
            slug: linux-cpu
            os: ubuntu-24.04
            features: ""
            cpu_only: true
          - target: linux-vulkan
            name: Linux, Vulkan
            slug: linux-vulkan
            os: ubuntu-24.04
            features: "--features clayspace-engine/vulkan"
            vulkan: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      # Without this the probe finds Metal on macOS and the "CPU only" row
      # tests what the Metal row already tests.
      - name: Ask for a CPU-only engine
        if: matrix.cpu_only
        run: echo "CLAYCORE_CPU_ONLY=1" >> "$GITHUB_ENV"

      # The slug rather than the name: a cache key may not contain a comma,
      # and "macOS, CPU only" does. Every run logged
      # `ValidationError: Key Validation Error … cannot contain commas` and
      # carried on without a cache, so every macOS job rebuilt the C++ engine
      # from scratch.
      #
      # And the profile beside it. `target/debug` and `target/release` are
      # different trees, so one key for both would have the two jobs racing to
      # save a `target/` holding half of what the key claims — and the loser
      # then restores a cache with none of its own artifacts in it, which is
      # the slow build this change exists to stop.
      - name: Cache cargo and the engine build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.slug }}-${{ matrix.profile }}
          # A cancelled or failing job saved nothing, so the next run rebuilt
          # from scratch and was slower, and was likelier to be cancelled in
          # turn. That loop is how a job that fits its budget stops fitting it.
          cache-on-failure: true

      # winit and wgpu need these to build on Linux even where no window is
      # ever opened; rfd needs GTK for its fallback dialog.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libgtk-3-dev \
            libtbb-dev

      # TBB and OpenMP are what the retopology engine's in-process QuadCover
      # field needs, and `cyberremesh-sys` configures with
      # `CYBER_REQUIRE_QUADCOVER=ON`, which makes their absence a
      # `FATAL_ERROR` at configure time rather than a silent fall back to the
      # portable quadrangulator. That is deliberate — a CI that quietly tested
      # a different quadrangulator than developers build would compare
      # different engines — but it means these packages are a build
      # requirement and not an optimisation.
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        # Best effort, not a requirement: `CYBER_REQUIRE_QUADCOVER` is Linux
        # only (the engine's own posture — see `cyberremesh-sys/build.rs`), so
        # this gives macOS the same quadrangulator when it can and the build
        # announces the fallback when it cannot. Guarded rather than bare,
        # because `brew install` on an already-present formula is a non-zero
        # exit and would fail the job for a dependency that is satisfied.
        run: brew list --formula tbb libomp >/dev/null 2>&1 || brew install tbb libomp

      - name: Vulkan SDK
        if: matrix.vulkan
        run: |
          # `libvulkan-dev` carries the headers; there is no `vulkan-headers`
          # package on Ubuntu 24.04, which is what the first attempt tried.
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev glslang-tools spirv-tools
          # The engine's build script looks for VULKAN_SDK. The distribution
          # packages install into /usr, which is a valid SDK root for its
          # purposes.
          echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"

      # `--all-targets` in the profile this job tests, so the test step does
      # not silently carry a compile the build step was supposed to have done.
      # That is where twenty-five of the cancelled run's ninety minutes went.
      # The step this file's own header has claimed since it was written. It was
      # never here, and nothing set a compiler launcher either, so every job
      # rebuilt both vendored C++ engines from scratch.
      #
      # Keyed on the row and not the profile: both engines hardcode
      # CMAKE_BUILD_TYPE=Release, so a row's debug and release jobs compile the
      # same C++ and can share one cache. The Rust cache above stays split by
      # profile, which is correct for `target/` and for a different reason.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.slug }}
          max-size: 2G

      - name: Build
        run: cargo build --workspace --all-targets ${{ matrix.features }} ${{ matrix.flag }}

      # Visual tests ask for a headless GPU and skip when there is none; the
      # window smoke asks for a display and skips likewise. Both report the
      # skip rather than passing quietly, so a runner that *should* have a
      # device shows up as a skip in the log rather than a false green.
      #
      # `--no-fail-fast` because cargo otherwise stops at the first test binary
      # that fails, and one red test then hides every other. It hid a real one:
      # `gesture_end` failed on macOS for weeks and `visual_incremental` never
      # ran behind it, so the run reported one problem where there were two.
      #
      # One profile, because this job is one profile. Both are still run on
      # every configuration — as two jobs that start together rather than as
      # two steps that wait for each other. Neither is redundant: a debug build
      # is where an overflow check and a `debug_assertions` branch exist at
      # all, and an optimised build is the only one where a timing budget means
      # anything, which `sculpt_latency`, `gesture_end` and `visual_brushes`
      # each say in their own words before declining to assert one in debug.
      - name: Test
        run: cargo test --workspace --no-fail-fast ${{ matrix.features }} ${{ matrix.flag }}

      # A visual test that fails says "see target/visual/…", and until now that
      # file went into the bin with the runner. The whole reason those tests
      # exist is that "several real defects were invisible to the assertions and
      # obvious in the picture" — so when one fails, the picture has to survive
      # the run.
      - name: Keep the captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # The profile too. Two jobs now reach this step for one commit, and
          # an artifact name is unique per run: the second upload would be
          # refused and the captures it was keeping would go into the bin with
          # the runner, which is the one thing this step exists to prevent.
          name: visual-${{ matrix.slug }}-${{ matrix.profile }}-${{ github.sha }}
          path: target/visual
          if-no-files-found: ignore

  # Figures, not assertions. The gate is a *regression* against a recorded
  # baseline — the specification asks for performance to be measured in CI
  # rather than asserted there, and absolute budgets that hold on a developer's
  # machine and not on a shared runner teach people to ignore the gate.
  # Budget breaches are printed either way.
  #
  # STATE OF THIS GATE: it is not comparing anything yet, and says so rather
  # than implying otherwise. `baseline-macos-aarch64.json` predates the
  # reference suite, so it states one scene where the reader expects a map,
  # `compare::unlike` declines, and a declining comparison is reported as "not
  # comparing" rather than as a pass. Recording a replacement needed a Mac
  # nobody had — except that this workflow already runs on one. `record-baseline`
  # below is that Mac. Once its artifact is committed, the refusal becomes a
  # failure (a gate that declines is indistinguishable from a gate that passed).
  benchmark:
    name: Performance
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark

      # See the note in the test job: `CYBER_REQUIRE_QUADCOVER=ON` makes these
      # a build requirement rather than an optimisation.
      - name: macOS build dependencies
        # Best effort, not a requirement: `CYBER_REQUIRE_QUADCOVER` is Linux
        # only (the engine's own posture — see `cyberremesh-sys/build.rs`), so
        # this gives macOS the same quadrangulator when it can and the build
        # announces the fallback when it cannot. Guarded rather than bare,
        # because `brew install` on an already-present formula is a non-zero
        # exit and would fail the job for a dependency that is satisfied.
        run: brew list --formula tbb libomp >/dev/null 2>&1 || brew install tbb libomp

      - name: Measure
        # `shell: bash` rather than the default `bash -e {0}`, because it also
        # brings `-o pipefail`. Without it the pipeline's status is `tee`'s,
        # and `tee` always succeeds — so the exit code the gate uses to fail a
        # regression was being thrown away before anyone could read it.
        #
        # The first thing that surfaced once it stopped being thrown away was
        # not a regression: the benchmark segfaults on this runner, in the
        # warm-up, and has been doing so unnoticed. So the two kinds of
        # non-zero are told apart rather than lumped together. A verdict the
        # gate reached — 1 for a regression, 2 for a refusal — fails the job,
        # which is the whole point of the change. A signal is the crash, and
        # it is reported loudly and tracked in #34 rather than failing every
        # branch for something no branch caused.
        #
        # When #34 is closed, delete the `>= 128` arm. It is quarantine, not
        # policy, and a quarantine with no expiry becomes the `tee` it replaced.
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo run --release --bin bench -- \
            --json "$RUNNER_TEMP/now.json" \
            --baseline benchmarks/baseline-macos-aarch64.json \
            | tee "$RUNNER_TEMP/report.txt" || status=$?

          if [ "$status" -ge 128 ]; then
            signal=$((status - 128))
            echo "::warning title=Benchmark crashed::the benchmark died on signal \
              $signal (exit $status) before reaching a verdict. Tracked in #34."
            exit 0
          fi
          exit "$status"

      # The figures outlive the run, so a regression can be looked at rather
      # than re-measured.
      - name: Keep the figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.sha }}
          path: |
            ${{ runner.temp }}/now.json
            ${{ runner.temp }}/report.txt

  # The Mac nobody had.
  #
  # `baseline-macos-aarch64.json` has been stale since before the reference
  # suite existed, and the reason it stayed stale is that re-recording it needs
  # an aarch64 Mac. This workflow has been running on one all along. Dispatched
  # by hand rather than on every push, because a baseline should be a decision
  # someone made, not a file that quietly moves under the gate.
  #
  # `--allow-busy` is passed deliberately: a shared runner is never quiet by the
  # threshold `load.rs` measured on a workstation, and refusing forever would
  # leave the gate with nothing to compare against — which is the worse of the
  # two failures. The load it was recorded under is written into the file, so
  # the noise is visible to whoever reads it rather than hidden.
  record-baseline:
    name: Record a baseline
    if: inputs.record_baseline
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, slug: macos-aarch64 }
          - { os: ubuntu-24.04, slug: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-record-${{ matrix.slug }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libtbb-dev
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        # Best effort, not a requirement: `CYBER_REQUIRE_QUADCOVER` is Linux
        # only (the engine's own posture — see `cyberremesh-sys/build.rs`), so
        # this gives macOS the same quadrangulator when it can and the build
        # announces the fallback when it cannot. Guarded rather than bare,
        # because `brew install` on an already-present formula is a non-zero
        # exit and would fail the job for a dependency that is satisfied.
        run: brew list --formula tbb libomp >/dev/null 2>&1 || brew install tbb libomp

      - name: Record
        shell: bash
        run: |
          cargo run --release --bin bench -- \
            --json "baseline-${{ matrix.slug }}.json" \
            --allow-busy

      - name: Keep it
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.slug }}
          path: baseline-${{ matrix.slug }}.json

  lint:
    name: Format, lint and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libgtk-3-dev \
            libtbb-dev

      - name: Formatting
        run: cargo fmt --all --check

      # Warnings are errors here and nowhere else: a warning that survives a
      # merge is a warning nobody will ever fix.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The agent end-to-end target is behind a feature, because building it
      # on every row of the test matrix buys a whole-application link for a
      # test that then skips. It is still compiled and linted here, where the
      # runner is cheap and the link is fast, so it cannot rot unnoticed.
      - name: Clippy, the opted-in targets
        run: |
          cargo clippy -p clayspace-app --features agent-e2e \
            --test agent_end_to_end -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      # Advisories and licences. Bans and sources are checked too, so a new
      # dependency that duplicates an existing one, or comes from somewhere
      # unexpected, is caught at the point it is added.
      - name: Dependency audit
        run: cargo deny check

  layering:
    name: Layering
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The architecture the specification asks for, checked mechanically:
      # the ViewModels cannot reach the engine, the view cannot reach the
      # model, and unsafe stays in the two crates that are allowed it. This
      # needs no build, so it is the fastest signal on a pull request.
      - name: Check the layering rules
        run: python3 tools/check_layering.py

  # Task 8.2: the same document, authored from nothing on each platform, has to
  # be the same file. A document is an edit list — it records what was asked
  # for, not what any backend computed — so a difference here would mean the
  # serializer is picking up something platform-shaped, which is the kind of
  # defect that only shows up when someone opens a colleague's file.
  document-bytes:
    name: Document bytes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # CPU only on both, so the comparison is between platforms rather than
      # between one platform's accelerator and another's.
      - run: echo "CLAYCORE_CPU_ONLY=1" >> "$GITHUB_ENV"
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libtbb-dev
      - name: Install the macOS build dependencies
        if: runner.os == 'macOS'
        # Best effort, not a requirement: `CYBER_REQUIRE_QUADCOVER` is Linux
        # only (the engine's own posture — see `cyberremesh-sys/build.rs`), so
        # this gives macOS the same quadrangulator when it can and the build
        # announces the fallback when it cannot. Guarded rather than bare,
        # because `brew install` on an already-present formula is a non-zero
        # exit and would fail the job for a dependency that is satisfied.
        run: brew list --formula tbb libomp >/dev/null 2>&1 || brew install tbb libomp
      - uses: Swatinem/rust-cache@v2
      - name: Write the canonical document
        run: cargo run -q -p clayspace-app --release --bin canonical -- canonical.clayspace
      - name: Take its digest
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum canonical.clayspace | awk '{print $1}' > digest.txt
          else
            shasum -a 256 canonical.clayspace | awk '{print $1}' > digest.txt
          fi
          cat digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: document-digest-${{ matrix.os }}
          path: digest.txt

  document-bytes-agree:
    name: Documents agree across platforms
    runs-on: ubuntu-24.04
    needs: document-bytes
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: document-digest-*
          path: digests
      - name: Compare the digests
        run: |
          set -eu
          found=$(find digests -name digest.txt | sort)
          echo "$found" | while read -r file; do
            echo "$(dirname "$file"): $(cat "$file")"
          done
          count=$(echo "$found" | wc -l | tr -d ' ')
          if [ "$count" -lt 2 ]; then
            echo "only $count platform reported a digest; nothing to compare" >&2
            exit 1
          fi
          unique=$(cat $found | sort -u | wc -l | tr -d ' ')
          if [ "$unique" -ne 1 ]; then
            echo "the canonical document is not byte-identical across platforms" >&2
            exit 1
          fi
          echo "byte-identical across $count platforms"

  packaging:
    name: Packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The submodule, because the attribution manifest reproduces the
      # engine's licence and reads it from `vendor/ClayCore/LICENSE`. Without
      # it the generator falls back to naming the path, and the committed
      # manifest — generated in a tree that has the submodule — no longer
      # matches. Nothing here builds the engine; this is one file.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The attribution manifest is generated from `cargo metadata`, so the
      # only way it goes wrong is by not being regenerated after a dependency
      # moves. This is that check, and it needs no engine build — `cargo
      # metadata` reads the manifests rather than compiling anything.
      - name: Check the packaging scripts and the attribution manifest
        run: python3 tools/test_tools.py

      # The budget note at the top of this file argues from step timings, and
      # #83 was filed because nobody could re-derive them. `tools/ci_budget.json`
      # is the pull they came from and this holds the note to it, so a figure
      # edited in one and not the other is a red job rather than a paragraph
      # that quietly stopped being true.
      - name: Check this file's budget note against its measurements
        run: python3 tools/check_ci_budget.py

  openspec:
    name: OpenSpec
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @fission-ai/openspec@latest
      # Strict: the specification and the code are supposed to describe the
      # same application, and a change that drifts from its spec is a change
      # whose intent has been lost.
      - name: Validate the change and the specs
        run: openspec validate --all --strict
