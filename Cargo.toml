[workspace]
resolver = "2"
members = [
    "crates/claycore-sys",
    "crates/claycore",
    "crates/clayspace-model",
    "crates/clayspace-engine",
    "crates/clayspace-vm",
    "crates/clayspace-view",
    "crates/clayspace-mcp",
    "crates/clayspace-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/CyberdyneCorp/ClaySpaceDesktop"

[workspace.dependencies]
claycore-sys = { path = "crates/claycore-sys" }
claycore = { path = "crates/claycore" }

[profile.release]
lto = "thin"
codegen-units = 1
