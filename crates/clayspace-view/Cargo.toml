[package]
name = "clayspace-view"
description = "The interface and renderer. Reads ViewModel state, emits commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published: this is an application, and its crates are its internals.
publish = false

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
clayspace-model = { version = "0.1.0", path = "../clayspace-model" }
clayspace-vm = { path = "../clayspace-vm" }
egui = "0.31.1"
egui-wgpu = "0.31.1"
egui-winit = "0.31.1"
glam = "0.33.3"
pollster = "1.0.1"
wgpu = "24.0.5"
winit = "0.30.13"
