[package]
name = "claycore"
description = "Safe Rust wrapper over the ClayCore C ABI. The only crate that calls claycore-sys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published: this is an application, and its crates are its internals.
publish = false

[features]
default = []
# Exposes constructors for errors that cannot be produced on demand, so tests
# exercise error handling rather than their own guess at an input.
test-support = []
metal = ["claycore-sys/metal"]
cuda = ["claycore-sys/cuda"]
vulkan = ["claycore-sys/vulkan"]
opencl = ["claycore-sys/opencl"]

[dependencies]
claycore-sys.workspace = true
