[package]
name = "clayspace-app"
description = "Composition root: builds the layers and runs the window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "clayspace_app"
path = "src/lib.rs"

[[bin]]
name = "clayspace-app"
path = "src/main.rs"

[dependencies]
clayspace-engine = { path = "../clayspace-engine" }
clayspace-model = { version = "0.1.0", path = "../clayspace-model" }
clayspace-vm = { version = "0.1.0", path = "../clayspace-vm" }
clayspace-view = { path = "../clayspace-view" }
winit = "0.30.13"
wgpu = "24.0.5"
pollster = "1.0.1"
egui = "0.31.1"
egui-wgpu = "0.31.1"
egui-winit = "0.31.1"
# Native open and save panels. macOS uses AppKit; Linux prefers the XDG
# portal and falls back to GTK, so a Wayland session gets its own dialog.
rfd = "0.15.4"

[dev-dependencies]
egui = "0.31.1"
egui-wgpu = "0.31.1"
png = "0.18.1"
pollster = "1.0.1"

# Harness-free: macOS requires the event loop on the process main thread, and
# libtest runs every #[test] on a spawned one. Without this the smoke test
# cannot create a window at all.
[[test]]
name = "window_smoke"
harness = false
