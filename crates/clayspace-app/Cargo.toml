[package]
name = "clayspace-app"
description = "Composition root: builds the layers and runs the window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clayspace-engine = { path = "../clayspace-engine" }
clayspace-model = { path = "../clayspace-model" }
clayspace-vm = { path = "../clayspace-vm" }
clayspace-view = { path = "../clayspace-view" }
winit = "0.30.13"
wgpu = "24.0.5"
pollster = "1.0.1"

[dev-dependencies]
png = "0.18.1"
pollster = "1.0.1"

# Harness-free: macOS requires the event loop on the process main thread, and
# libtest runs every #[test] on a spawned one. Without this the smoke test
# cannot create a window at all.
[[test]]
name = "window_smoke"
harness = false
