[package]
name = "clayspace-app"
description = "Composition root: builds the layers and runs the window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published: this is an application, and its crates are its internals.
publish = false
# The crate carries three binaries — the application, the benchmark and the
# canonical-document writer — so `cargo run -p clayspace-app` has to be told
# which, or it refuses. Naming the application here means the obvious command
# does the obvious thing.
default-run = "clayspace-app"

[lib]
name = "clayspace_app"
path = "src/lib.rs"

[[bin]]
name = "clayspace-app"
path = "src/main.rs"

[features]
default = []
# The whole chain, so the binary can be built for a backend by name.
metal = ["clayspace-engine/metal"]
cuda = ["clayspace-engine/cuda"]
vulkan = ["clayspace-engine/vulkan"]
opencl = ["clayspace-engine/opencl"]

[dependencies]
clayspace-engine = { path = "../clayspace-engine" }
clayspace-model = { version = "0.1.0", path = "../clayspace-model" }
clayspace-vm = { version = "0.1.0", path = "../clayspace-vm" }
clayspace-mcp = { path = "../clayspace-mcp" }
clayspace-view = { path = "../clayspace-view" }
winit = "0.30.13"
wgpu = "24.0.5"
pollster = "1.0.1"
egui = "0.31.1"
egui-wgpu = "0.31.1"
egui-winit = "0.31.1"
# Native open and save panels. macOS uses AppKit; Linux prefers the XDG
# portal and falls back to GTK, so a Wayland session gets its own dialog.
rfd = "0.15.4"

[dev-dependencies]
# The end-to-end test speaks the tool surface's own wire, so it reads JSON.
serde_json = "1.0.145"
egui = "0.31.1"
egui-wgpu = "0.31.1"
png = "0.18.1"
pollster = "1.0.1"

# Harness-free: macOS requires the event loop on the process main thread, and
# libtest runs every #[test] on a spawned one. Without this the smoke test
# cannot create a window at all.
[[test]]
name = "window_smoke"
harness = false
